<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha</title><body style="font:16px Arial;background:#203629;display:grid;place-items:center;min-height:100vh"><form id="f" style="background:#faf7ee;padding:35px;max-width:420px"><h1>Nova senha</h1><input id="pwd" type="password" placeholder="Nova senha (mín. 6 caracteres)" minlength="6" required><button>Atualizar senha</button><p id="msg"></p><a href="/">Voltar</a></form><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.8';import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './config.js';const c=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);document.getElementById('f').onsubmit=async e=>{e.preventDefault();const {error}=await c.auth.updateUser({password:document.getElementById('pwd').value});document.getElementById('msg').textContent=error?error.message:'Senha atualizada com sucesso.'}</script></body></html>
